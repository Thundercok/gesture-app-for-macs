name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Build & Test (macOS 14)
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Swift Build
        run: |
          cd GestureFlowApp
          swift build

      - name: Swift Test
        run: |
          cd GestureFlowApp
          swift test

      - name: Python Unit Tests
        run: |
          python3 -m unittest discover -s tools -p "test_*.py" -v
